<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xưởng Truyện</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="#library">✦ XƯỞNG TRUYỆN <small>0.1.1</small></a><div><button id="backup">Sao lưu JSON</button><button id="restore">Nhập sao lưu</button><input type="file" id="file" accept="application/json" hidden></div></header><div class="shell"><aside><label>BỘ TRUYỆN ĐANG LÀM<select id="bookSelect"></select></label><nav id="nav"></nav><p class="hint">Dữ liệu lưu trên máy bằng SQLite.<br>AI: sao chép yêu cầu sang ChatGPT, nhận kết quả về để duyệt.</p></aside><main id="main"><p>Đang mở xưởng…</p></main></div><dialog id="editor"><form id="form"><div class="head"><h2 id="dialogTitle"></h2><button type="button" id="close" aria-label="Đóng">×</button></div><div id="fields"></div><p id="formError" role="alert"></p><footer><button type="button" id="cancel">Hủy</button><button class="primary">Lưu thay đổi</button></footer></form></dialog><dialog id="ai"><div class="head"><h2>Yêu cầu sản xuất</h2><button id="closeAI" aria-label="Đóng yêu cầu">×</button></div><p>1. Sao chép yêu cầu, gửi trong ChatGPT. 2. Dán kết quả vào ô bên dưới. 3. Lưu bản chờ duyệt.</p><textarea id="prompt" readonly rows="13"></textarea><div class="actions"><button id="copy">Sao chép yêu cầu</button><a href="https://chatgpt.com/" target="_blank" rel="noopener">Mở ChatGPT ↗</a></div><label>KẾT QUẢ TỪ CHATGPT<textarea id="result" rows="9" placeholder="Dán nội dung trả về ở đây…"></textarea></label><button id="receive" class="primary">Nhận kết quả chờ duyệt</button></dialog><output id="toast" role="status"></output><script src="core.js"></script><script src="app.js"></script><script src="english.js"></script><script src="recovery.js"></script></body></html>
